<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
    <linearGradient id="fav-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#fav-primary-grad)" />

  <!-- Glass Bevel Highlight -->
  <rect x="5" y="5" width="90" height="45" rx="25" fill="url(#fav-shimmer)" opacity="0.45" />

  <!-- Camera Outer Line -->
  <rect x="16" y="16" width="68" height="68" rx="18" stroke="#ffffff" stroke-width="5.5" stroke-opacity="0.95" fill="none" />

  <!-- Center Lens -->
  <circle cx="50" cy="50" r="20" stroke="#ffffff" stroke-width="5" stroke-opacity="0.95" fill="rgba(0,0,0,0.25)" />

  <!-- Sparkle Flash Dot -->
  <circle cx="72" cy="28" r="4.5" fill="#ffffff" />

  <!-- Download Arrow -->
  <path d="M50 37 L50 56" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <path d="M42 50 L50 58 L58 50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M40 64 L60 64" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
</svg>
